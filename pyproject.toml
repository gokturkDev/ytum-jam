[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kings-ambassador"
version = "0.2.0"
description = "Turkish terminal persuasion game with an authoritative HTTP engine"
requires-python = ">=3.11"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "pydantic==2.14.1", "pydantic-settings==2.16.1", "openai==3.37.0", "httpx==0.28.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ambassador = ["prompts/*.txt", "scenarios/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
